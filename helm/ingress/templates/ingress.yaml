# AWS ALB Ingress — routes all external traffic through a single internet-facing ALB.
# Requires: AWS Load Balancer Controller v2.x+ installed in the cluster.
#
# Path routing (longest-prefix-wins, ALB rules evaluated top-to-bottom):
#   /api/auth     → auth-service:8001
#   /api/products → product-service:8002
#   /api/orders   → order-service:8003
#   /             → frontend-service:3000  (catch-all)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopnova-alb-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app: shopnova
  annotations:
    # ── AWS ALB annotations ────────────────────────────────────────────────────
    # Legacy annotation (kept for backwards compatibility with older LBC versions)
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: {{ .Values.scheme }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.targetType }}
    # NOTE: no spaces inside the JSON — ALB controller parser is strict
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # Uncomment the two lines below to enable HTTPS (recommended for production):
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    # alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_ID"
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    # Frontend nginx has no /health endpoint — use / for frontend health checks.
    # Backend services (/api/*) expose GET /health which returns 200.
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  # ingressClassName is required by AWS Load Balancer Controller v2.x+
  ingressClassName: alb
  rules:
    - http:
        paths:
          # ── API routes (specific prefixes listed before catch-all) ──────────
          - path: {{ .Values.routes.auth.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.routes.auth.serviceName }}
                port:
                  number: {{ .Values.routes.auth.servicePort }}
          - path: {{ .Values.routes.product.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.routes.product.serviceName }}
                port:
                  number: {{ .Values.routes.product.servicePort }}
          - path: {{ .Values.routes.order.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.routes.order.serviceName }}
                port:
                  number: {{ .Values.routes.order.servicePort }}
          # ── Catch-all → frontend (must be last) ───────────────────────────
          - path: {{ .Values.routes.frontend.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.routes.frontend.serviceName }}
                port:
                  number: {{ .Values.routes.frontend.servicePort }}
