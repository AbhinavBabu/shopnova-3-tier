apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    environment: production
    app: shopnova
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopnova-config
  namespace: {{ .Values.namespace }}
data:
  NODE_ENV: {{ .Values.config.NODE_ENV | quote }}
  AUTH_PORT: {{ .Values.config.AUTH_PORT | quote }}
  PRODUCT_PORT: {{ .Values.config.PRODUCT_PORT | quote }}
  ORDER_PORT: {{ .Values.config.ORDER_PORT | quote }}
  NOTIFICATION_PORT: {{ .Values.config.NOTIFICATION_PORT | quote }}
  FRONTEND_PORT: {{ .Values.config.FRONTEND_PORT | quote }}
  NOTIFICATION_SERVICE_HOST: {{ .Values.config.NOTIFICATION_SERVICE_HOST | quote }}
  NOTIFICATION_SERVICE_PORT: {{ .Values.config.NOTIFICATION_SERVICE_PORT | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Values.namespace }}
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    }
---
# NOTE: shopnova-secrets is no longer managed by this Helm chart.
# It is applied separately as a standalone manifest: k8s/secrets.yaml
# All deployment templates continue to reference it by name via secretKeyRef —
# no changes to those templates are required.
