server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend proxy ─────────────────────────────────────────────────────────
    # Targets are resolved from environment variables at container startup.
    # Local docker-compose : AUTH_SERVICE_HOST=auth-service, PORT=8001 (Docker DNS)
    # Split-EC2 / ALB      : AUTH_SERVICE_HOST=<alb-dns>, AUTH_SERVICE_PORT=80
    #
    # NOTE: $uri, $host, $remote_addr, $proxy_add_x_forwarded_for are standard
    # nginx variables and are NOT substituted — envsubst is called with an
    # explicit variable list (see Dockerfile CMD).

    location /api/auth/ {
        proxy_pass http://${AUTH_SERVICE_HOST}:${AUTH_SERVICE_PORT}/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/products/ {
        proxy_pass http://${PRODUCT_SERVICE_HOST}:${PRODUCT_SERVICE_PORT}/api/products/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/orders/ {
        proxy_pass http://${ORDER_SERVICE_HOST}:${ORDER_SERVICE_PORT}/api/orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
